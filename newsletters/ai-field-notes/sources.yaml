# AI Field Notes source roster.
# Research starting points, not endorsements or quotas. Follow original sources before commentary.
# To add a source: copy an entry into the right tier. `roster: true` means it appears in each
# issue's source-roster table (what it published in the window); other tiers are scanned for
# material but not listed one by one.
#
# How to check a source: read its homepage or archive page with
# `python3 scripts/fieldnotes.py fetch <url> --links` (see RUNBOOK.md; RSS feeds are often blocked);
# use WebSearch with site:<domain> only to discover posts. Confirm every publish date on the page
# itself; never guess. Simon Willison has day archives: https://simonwillison.net/2026/Nov/14/

practitioners:          # independent analysts and engineers; scan every issue, list in roster
  - {name: Simon Willison, url: "https://simonwillison.net/", roster: true,
     note: "High volume. Prefer substantive entries and link-blog items on agents, tooling, LLM engineering, security. Also llm.datasette.io."}
  - {name: Latent Space, url: "https://www.latent.space/", roster: true,
     note: "Articles, podcast transcripts, AI News roundups."}
  - {name: Hamel Husain, url: "https://hamel.dev/", roster: true, note: "Applied LLM engineering, evals, agent reliability."}
  - {name: Eugene Yan, url: "https://eugeneyan.com/", roster: true}
  - {name: Chip Huyen, url: "https://huyenchip.com/blog/", roster: true, note: "AI engineering, inference, agents, system design."}
  - {name: Martin Fowler, url: "https://martinfowler.com/", roster: true, note: "AI/LLM/agent items only, including Fragments."}
  - {name: Jason Liu, url: "https://jxnl.co/", roster: true}
  - {name: "Sebastian Raschka, Ahead of AI", url: "https://magazine.sebastianraschka.com/", roster: true,
     note: "Model architectures and training. Also sebastianraschka.com/blog/."}
  - {name: "Nathan Lambert, Interconnects", url: "https://www.interconnects.ai/", roster: true,
     note: "Models, training, open-weight ecosystem, post-training."}
  - {name: "Jack Clark, Import AI", url: "https://importai.substack.com/", roster: true, note: "Also jack-clark.net."}
  - {name: "Ethan Mollick, One Useful Thing", url: "https://www.oneusefulthing.org/", roster: true,
     note: "Real-world adoption, human-AI work, empirical research."}
  - {name: "Gergely Orosz, The Pragmatic Engineer", url: "https://newsletter.pragmaticengineer.com/", roster: true,
     note: "AI posts only. Often paywalled; say so."}
  - {name: Lilian Weng, url: "https://lilianweng.github.io/", roster: true, note: "Research-oriented technical essays; infrequent."}
  - {name: METR, url: "https://metr.org/", roster: true, note: "Empirical task-completion and capability evaluations."}
  - {name: Epoch AI, url: "https://epoch.ai/", roster: true, note: "Model trends, compute, AI economics."}

builders:               # people showing how to apply AI in daily work; scan every issue, list in roster
  # YouTube: python3 scripts/fieldnotes.py youtube @handle --since <window start>  (title, date, link, description)
  - {name: "Nate B Jones (AI News & Strategy Daily)", youtube: "@NateBJones", url: "https://natesnewsletter.substack.com/", roster: true,
     note: "Daily applied strategy: what a development means for your work and your AI bill."}
  - {name: Cole Medin, youtube: "@ColeMedin", roster: true, note: "Full agent builds, local models, agentic coding. Flag sponsored Shorts."}
  - {name: IndyDevDan, youtube: "@indydevdan", roster: true, note: "Agentic coding workflows and 'software factories'."}
  - {name: Sam Witteveen, youtube: "@samwitteveenai", roster: true, note: "Hands-on walkthroughs of new models, frameworks and APIs, usually within days."}
  - {name: "Lenny's Podcast", youtube: "@LennysPodcast", url: "https://www.lennysnewsletter.com/", roster: true,
     note: "How product and engineering leaders use AI; transcripts on lennysnewsletter.com."}
  - {name: "Every (AI & I)", youtube: "@EveryInc", url: "https://every.to/", roster: true,
     note: "Hands-on model comparisons and workflow interviews. Many Shorts; prefer full episodes."}
  - {name: Riley Brown, youtube: "@rileybrownai", roster: true, note: "Weekly roundup of AI work tools, building apps with AI; accessible to non-engineers."}
  - {name: Ray Amjad, youtube: "@RAmjad", url: "https://www.agenticcoding.school/newsletter", roster: true,
     note: "Claude Code and agentic-coding deep dives on new harness features. Says no sponsors, but promotes his own courses and products."}

builders_rotating:      # scan when time allows, use for discovery; feature when they have the best applied item
  - {name: Mckay Wrigley, youtube: "@realmckaywrigley", note: "Inactive since Jul 2025; check occasionally."}
  - {name: AI Jason, note: "Agent and tool-use builds."}
  - {name: Riley Goodside / prompt craft, note: "Discovery only."}
  - {name: "Theo (t3.gg)", note: "Opinions on AI dev tools."}
  - {name: Fireship, note: "Fast release summaries; discovery only."}
  - {name: Andrej Karpathy, note: "Occasional definitive explainers."}
  - {name: All About AI, note: "Quick experiments with new tools."}
  - {name: "Matthew Berman, Wes Roth, AI Explained", note: "Release news; discovery only, then go to the primary source."}
  - {name: "Jeff Su, Tina Huang", note: "AI productivity for knowledge workers."}
  # Resolve a channel's handle with the youtube command before relying on it; record verified handles here.

tool_changelogs:        # often the most directly usable updates; scan every issue
  - {name: Claude Code, url: "https://code.claude.com/docs/en/changelog"}
  - {name: Claude platform release notes, url: "https://platform.claude.com/docs/en/release-notes/overview"}
  - {name: Cursor, url: "https://cursor.com/changelog"}
  - {name: GitHub Copilot and GitHub changelog, url: "https://github.blog/changelog/"}
  - {name: OpenAI API changelog, url: "https://platform.openai.com/docs/changelog", note: "Often refuses scripts (403); use the RSS https://openai.com/news/rss.xml"}
  - {name: Gemini API changelog, url: "https://ai.google.dev/gemini-api/docs/changelog"}

labs:                   # primary labs and engineering organizations; scan every issue
  - {name: Anthropic, urls: ["https://www.anthropic.com/engineering", "https://www.anthropic.com/research", "https://docs.anthropic.com/"], roster: true}
  - {name: OpenAI, urls: ["https://openai.com/research/", "https://openai.com/index/", "https://platform.openai.com/docs/"], roster: true}
  - {name: Google DeepMind, urls: ["https://deepmind.google/discover/blog/", "https://deepmind.google/research/", "https://ai.google.dev/"], roster: true}
  - {name: Google Research, url: "https://research.google/blog/"}
  - {name: "LangChain / LangGraph / LangSmith", urls: ["https://blog.langchain.com/", "https://docs.langchain.com/"]}
  - {name: Microsoft Research, url: "https://www.microsoft.com/en-us/research/blog/"}
  - {name: Microsoft Azure AI, url: "https://learn.microsoft.com/en-us/azure/ai-services/"}
  - {name: Hugging Face, urls: ["https://huggingface.co/blog", "https://huggingface.co/papers"]}
  - {name: AWS, urls: ["https://aws.amazon.com/blogs/machine-learning/", "https://aws.amazon.com/architecture/"]}
  - {name: Cloudflare, url: "https://blog.cloudflare.com/tag/ai/"}
  - {name: NVIDIA, url: "https://developer.nvidia.com/blog/"}
  - {name: Databricks, url: "https://www.databricks.com/blog"}
  - {name: Weights & Biases, url: "https://wandb.ai/site/articles/"}

papers_and_code:        # search for the window's notable items; don't list in roster
  - {name: arXiv, urls: ["https://arxiv.org/list/cs.AI/recent", "https://arxiv.org/list/cs.LG/recent", "https://arxiv.org/list/cs.CL/recent", "https://arxiv.org/list/cs.DC/recent"]}
  - {name: OpenReview, url: "https://openreview.net/"}
  - {name: Papers with Code, url: "https://paperswithcode.com/"}
  - {name: GitHub releases and issues, url: "https://github.com/", note: "Track the specific repositories mentioned in stories."}

standards_and_security: # check when a story touches governance or security
  - {name: NIST AI RMF, url: "https://www.nist.gov/itl/ai-risk-management-framework"}
  - {name: NIST AI 600-1 GenAI Profile, url: "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.600-1.pdf"}
  - {name: OWASP Top 10 for LLM Applications, url: "https://genai.owasp.org/"}
  - {name: MITRE ATLAS, url: "https://atlas.mitre.org/"}
  - {name: Model Context Protocol spec, url: "https://modelcontextprotocol.io/"}
  - {name: Agent Skills spec, url: "https://agentskills.io/"}

primary_evidence:       # for policy, economics, procurement and incidents: link here, not to coverage
  - {name: SEC EDGAR, url: "https://www.sec.gov/edgar/search/"}
  - {name: NIST, url: "https://www.nist.gov/"}
  - {name: CISA, url: "https://www.cisa.gov/"}
  - {name: Federal Register, url: "https://www.federalregister.gov/"}
  - {name: Google Scholar, url: "https://scholar.google.com/"}
