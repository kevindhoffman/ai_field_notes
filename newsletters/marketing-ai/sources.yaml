# Marketing AI | Field Notes source roster.
# Research starting points, not endorsements or quotas. Follow original sources before commentary.
# To add a source: copy an entry into the right tier. `roster: true` means it appears in each
# issue's source-roster table (what it published in the window); other tiers are scanned for
# material but not listed one by one.
#
# How to check a source: read its homepage or archive page with
# `python3 scripts/fieldnotes.py fetch <url> --links` (see RUNBOOK.md; RSS feeds are often blocked);
# YouTube channels with `python3 scripts/fieldnotes.py youtube @handle --since <window start>`.
# Use WebSearch with site:<domain> only to discover posts. Confirm every publish date on the page
# itself; never guess. A source whose host the network proxy blocks is "unchecked", never "0 posts".
#
# Verification (2026-11-19): YouTube handles were checked with the youtube command. Most web hosts
# below were BLOCKED by the environment's network proxy ("no rule or network setting allows this
# host"); for those, the latest post date in `note` comes from WebSearch and is marked "(search)".
# Entries marked "host blocked" need their hostname added to the environment allowlist.

